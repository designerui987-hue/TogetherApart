<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Together Apart — 3D Character Preview Showcase</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
  <link rel="stylesheet" href="./style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0f17;
      display: flex;
      flex-direction: column;
    }
    .preview-navbar {
      height: 64px;
      background: rgba(20, 24, 38, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 10;
    }
    .preview-main {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    .preview-canvas-box {
      flex: 1;
      height: 100%;
      position: relative;
    }
    #preview-canvas-container {
      width: 100%;
      height: 100%;
    }
    .concept-split-box {
      width: 520px;
      height: 100%;
      background: rgba(14, 18, 28, 0.96);
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      z-index: 5;
    }
    .concept-split-box.hidden {
      display: none;
    }
    .concept-split-box img {
      width: 100%;
      height: calc(100% - 44px);
      object-fit: contain;
      padding: 12px;
    }
    .concept-split-title {
      padding: 12px 18px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #f3cd82;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .preview-sidebar {
      width: 380px;
      height: 100%;
      background: rgba(18, 22, 34, 0.94);
      backdrop-filter: blur(12px);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 5;
    }
    .cam-presets-floating {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(14, 18, 28, 0.88);
      backdrop-filter: blur(10px);
      padding: 6px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      z-index: 4;
    }
    .cam-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #eee;
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: inherit;
      transition: all 0.2s;
    }
    .cam-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .cam-btn.active { background: #56c5d5; color: #0b1a20; font-weight: 700; }
  </style>
</head>
<body>
  <div class="preview-navbar">
    <div style="display:flex; align-items:center; gap: 14px;">
      <a href="/" class="btn btn-ghost" style="padding: 6px 12px; font-size: 0.85rem;">⬅ Game</a>
      <h2 style="margin:0; font-size:1.25rem; color:#fff;">Together Apart — 3D Character Showcase</h2>
      <span class="badge" style="background: rgba(86,197,213,0.2); border: 1px solid #56c5d5; color:#c7f3fa;">V2 Reference Master</span>
    </div>
    <div style="display:flex; gap:10px;">
      <button id="btn-char-lumi" class="btn btn-primary active">✨ Lumi (Light Weaver)</button>
      <button id="btn-char-nova" class="btn btn-secondary">⚡ Nova (Kinetic Shaper)</button>
    </div>
  </div>

  <div class="preview-main">
    <!-- Concept Split View -->
    <div id="concept-split-box" class="concept-split-box">
      <div class="concept-split-title">Official 2D Concept Specification Sheet</div>
      <img id="concept-img" src="/assets/references/lumi-concept.png" alt="Concept Sheet" />
    </div>

    <!-- 3D Viewport -->
    <div class="preview-canvas-box">
      <div id="preview-canvas-container"></div>
      
      <div class="cam-presets-floating">
        <button class="cam-btn active" data-cam="hero">Hero 3/4</button>
        <button class="cam-btn" data-cam="front">Front Turnaround</button>
        <button class="cam-btn" data-cam="side">Side Turnaround</button>
        <button class="cam-btn" data-cam="back">Back Turnaround</button>
        <button class="cam-btn" data-cam="face">Face Close-up</button>
        <button class="cam-btn" data-cam="detail">Detail View</button>
      </div>
    </div>

    <!-- Controls Sidebar -->
    <div class="preview-sidebar">
      <!-- Live Metrics Card -->
      <div class="showcase-card">
        <h3>Model Technical Statistics</h3>
        <div class="stats-grid">
          <div class="s-chip"><span class="s-lbl">Triangles</span><strong id="stat-tris">--</strong></div>
          <div class="s-chip"><span class="s-lbl">Vertices</span><strong id="stat-verts">--</strong></div>
          <div class="s-chip"><span class="s-lbl">Meshes</span><strong id="stat-meshes">--</strong></div>
          <div class="s-chip"><span class="s-lbl">Materials</span><strong id="stat-mats">--</strong></div>
        </div>
      </div>

      <!-- Animation Actions -->
      <div class="showcase-card">
        <h3>Animation Actions (14 Actions)</h3>
        <div class="form-group">
          <label for="anim-select">Action Name</label>
          <select id="anim-select" class="form-select"></select>
        </div>
        <div class="anim-playback-row">
          <button id="btn-play-pause" class="btn btn-accent btn-sm">⏸ Pause</button>
          <div class="slider-field">
            <label>Playback: <span id="val-speed">1.0x</span></label>
            <input type="range" id="slider-speed" min="0.2" max="2.0" step="0.1" value="1.0" />
          </div>
        </div>
      </div>

      <!-- Facial Shape Keys -->
      <div class="showcase-card">
        <h3>Facial Shape Keys (Morph Targets)</h3>
        <div class="morph-sliders-box">
          <div class="slider-row">
            <label>Smile: <span id="val-smile">0.00</span></label>
            <input type="range" class="morph-slider" data-morph="Smile" min="0" max="1" step="0.05" value="0" />
          </div>
          <div class="slider-row">
            <label>Joyful / Confident: <span id="val-joyful">0.00</span></label>
            <input type="range" class="morph-slider" data-morph="Joyful" min="0" max="1" step="0.05" value="0" />
          </div>
          <div class="slider-row">
            <label>Focused: <span id="val-focused">0.00</span></label>
            <input type="range" class="morph-slider" data-morph="Focused" min="0" max="1" step="0.05" value="0" />
          </div>
          <div class="slider-row">
            <label>Playful: <span id="val-playful">0.00</span></label>
            <input type="range" class="morph-slider" data-morph="Playful" min="0" max="1" step="0.05" value="0" />
          </div>
          <div class="slider-row">
            <label>Blink (Left/Right): <span id="val-blinkboth">0.00</span></label>
            <input type="range" class="morph-slider" data-morph="BlinkBoth" min="0" max="1" step="0.05" value="0" />
          </div>
          <div class="slider-row">
            <label>Mouth Open: <span id="val-mouthopen">0.00</span></label>
            <input type="range" class="morph-slider" data-morph="MouthOpen" min="0" max="1" step="0.05" value="0" />
          </div>
        </div>
      </div>

      <!-- Inspection Toggles -->
      <div class="showcase-card">
        <h3>Inspection Controls</h3>
        <div class="toggle-group">
          <label class="toggle-label">
            <input type="checkbox" id="check-turntable" />
            <span>360° Turntable Auto-Rotate</span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="check-wireframe" />
            <span>Wireframe Mesh Mode</span>
          </label>
          <button id="btn-toggle-concept" class="btn btn-outline btn-sm">📋 Toggle 2D Concept Art Split-View</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/preview.ts"></script>
</body>
</html>
